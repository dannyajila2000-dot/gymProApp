services:
  - type: web
    name: gymsaas-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL_SEGUNDOS
        value: "900"
      - key: JWT_REFRESH_TTL_DIAS
        value: "30"
